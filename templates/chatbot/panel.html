  <header class="chatbot-heading">
    <div>
      <h2 id="chatbotTitle">Bengaluru city assistant</h2>
      <p>Traffic, air quality, waste and city alerts</p>
    </div>
    <span class="chatbot-status" id="chatbotStatus" aria-live="polite">Checking AI...</span>
  </header>
  <div id="chatWindow" class="chat-window" role="log" aria-live="polite" aria-relevant="additions"></div>
  <form id="chatForm" class="chat-form">
    <label class="sr-only" for="chatInput">Message the Bengaluru city assistant</label>
    <input type="text" id="chatInput" placeholder="Ask about Bengaluru right now..." autocomplete="off" required>
    <button id="chatSend" type="submit">Send</button>
  </form>
</section>
